<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Inter, DejaVu Sans, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#0f172a}
      .s{font-size:12.5px;fill:#334155}
      .m{font-size:12px;fill:#475569}
      .h{font-size:13px;font-weight:700;letter-spacing:.06em;fill:#475569}
      .lbl{font-size:12.5px;font-weight:600}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#ffffff"/>
  <text x="40" y="44" font-size="26" font-weight="700" fill="#0f172a">ClearOps GitOps: Jenkins builds, git decides, ArgoCD deploys</text>
  <text x="40" y="70" class="m">Module 12.5. Local Minikube in WSL. Jenkins never touches the cluster; the cluster pulls from git and Docker Hub.</text>

  <!-- LEFT: CI side -->
  <text x="40" y="112" class="h">CI (ON THE LAPTOP)</text>
  <rect x="40" y="124" width="200" height="56" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="140" y="149" text-anchor="middle" class="t">Developer</text>
  <text x="140" y="168" text-anchor="middle" class="m">feat: / fix: commits</text>

  <rect x="40" y="220" width="250" height="78" rx="10" fill="#f1f5f9" stroke="#64748b"/>
  <text x="58" y="246" class="t">clearops-app</text>
  <text x="58" y="266" class="s">GitHub, app repo</text>
  <text x="58" y="284" class="m">services/, Jenkinsfile</text>
  <line x1="140" y1="180" x2="140" y2="218" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="150" y="203" class="m">git push</text>

  <rect x="40" y="350" width="470" height="262" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="60" y="378" class="t">Jenkins 2.580.2 (Docker, 127.0.0.1:8090)</text>
  <text x="60" y="398" class="m">Polls clearops-app every 2 min. Holds two narrow credentials only.</text>
  <g class="s">
    <text x="64" y="426">1  Prepare SSH: pin GitHub host key, check fingerprint</text>
    <text x="64" y="450">2  Compute version: read deployed tag, bump by commit prefix,</text>
    <text x="86" y="468">skip any tag already on Docker Hub</text>
    <text x="64" y="492">3  hadolint   4  build (version baked in)   5  test /health</text>
    <text x="64" y="516">6  push images to Docker Hub</text>
    <text x="64" y="540">7  kustomize edit set image, commit, push to clearops-gitops</text>
  </g>
  <rect x="60" y="556" width="430" height="40" rx="8" fill="#ffedd5"/>
  <text x="275" y="581" text-anchor="middle" class="lbl" fill="#9a3412">No deploy stage. No kubectl. No cluster credentials.</text>
  <line x1="165" y1="298" x2="165" y2="348" stroke="#334155" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="175" y="328" class="m">polled (pull)</text>

  <rect x="40" y="690" width="250" height="96" rx="10" fill="#eff6ff" stroke="#2563eb"/>
  <text x="58" y="716" class="t">Docker Hub</text>
  <text x="58" y="736" class="s">crystalvivian/clearops-api</text>
  <text x="58" y="754" class="s">crystalvivian/clearops-frontend</text>
  <text x="58" y="773" class="m">immutable semver tags: 1.1.0 ... 1.2.0</text>
  <line x1="165" y1="612" x2="165" y2="688" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="175" y="655" class="m">docker push</text>

  <!-- MIDDLE: config repo -->
  <text x="560" y="112" class="h">SOURCE OF TRUTH</text>
  <rect x="560" y="300" width="250" height="250" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="578" y="328" class="t">clearops-gitops</text>
  <text x="578" y="348" class="s">GitHub, config repo</text>
  <g class="m">
    <text x="578" y="378">apps/clearops/base</text>
    <text x="578" y="398">apps/clearops/overlays/dev</text>
    <text x="578" y="418">apps/clearops/overlays/staging</text>
    <text x="596" y="436">+ redis-auth SealedSecret</text>
    <text x="578" y="460">argocd/root.yaml</text>
    <text x="578" y="480">argocd/apps/clearops-appset.yaml</text>
    <text x="578" y="500">argocd/projects/, argocd/config/</text>
  </g>
  <text x="578" y="532" class="s" font-weight="600" fill="#15803d">git log = deploy history</text>
  <path d="M510 520 C 535 520, 535 480, 558 480" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="520" y="600" class="m">deploy key,</text>
  <text x="520" y="616" class="m">this repo only:</text>
  <text x="520" y="632" class="m">"chore(dev): bump"</text>
  <rect x="560" y="200" width="250" height="62" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="578" y="225" class="t">Pull request</text>
  <text x="578" y="245" class="m">promote same tag to staging</text>
  <line x1="685" y1="262" x2="685" y2="298" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- RIGHT: cluster -->
  <text x="860" y="112" class="h">MINIKUBE CLUSTER (WSL)</text>
  <rect x="860" y="124" width="700" height="800" rx="16" fill="#f8fafc" stroke="#475569" stroke-width="1.5" stroke-dasharray="8 5"/>

  <rect x="880" y="144" width="660" height="250" rx="12" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="898" y="170" class="t">namespace argocd: ArgoCD v3.5.6</text>
  <g>
    <rect x="898" y="184" width="150" height="40" rx="7" fill="#ede9fe"/><text x="973" y="209" text-anchor="middle" class="s">repo-server</text>
    <rect x="1058" y="184" width="200" height="40" rx="7" fill="#ede9fe"/><text x="1158" y="209" text-anchor="middle" class="s">application-controller</text>
    <rect x="1268" y="184" width="254" height="40" rx="7" fill="#ede9fe"/><text x="1395" y="209" text-anchor="middle" class="s">notifications-controller</text>
  </g>
  <rect x="898" y="246" width="150" height="52" rx="8" fill="#fff" stroke="#7c3aed"/>
  <text x="973" y="268" text-anchor="middle" class="t">root</text>
  <text x="973" y="286" text-anchor="middle" class="m">project: platform</text>
  <rect x="1088" y="246" width="190" height="52" rx="8" fill="#fff" stroke="#7c3aed"/>
  <text x="1183" y="268" text-anchor="middle" class="t">ApplicationSet</text>
  <text x="1183" y="286" text-anchor="middle" class="m">one app per overlay folder</text>
  <rect x="1318" y="240" width="204" height="30" rx="7" fill="#fff" stroke="#7c3aed"/>
  <text x="1420" y="260" text-anchor="middle" class="s">clearops-dev</text>
  <rect x="1318" y="276" width="204" height="30" rx="7" fill="#fff" stroke="#7c3aed"/>
  <text x="1420" y="296" text-anchor="middle" class="s">clearops-staging</text>
  <line x1="1048" y1="272" x2="1086" y2="272" stroke="#7c3aed" stroke-width="2" marker-end="url(#v)"/>
  <line x1="1278" y1="266" x2="1316" y2="257" stroke="#7c3aed" stroke-width="2" marker-end="url(#v)"/>
  <line x1="1278" y1="278" x2="1316" y2="290" stroke="#7c3aed" stroke-width="2" marker-end="url(#v)"/>
  <text x="898" y="322" class="m">AppProject clearops: one repo, dev + staging namespaces only.</text>
  <text x="898" y="340" class="m">AppProject platform: root may create only Applications and ApplicationSets.</text>
  <text x="898" y="358" class="m">Automated sync, self-heal, prune, retry. Read-only "viewer" account via RBAC.</text>
  <text x="898" y="376" class="m">Waves: Secret, NetworkPolicy, ConfigMap (-1), Redis (0), API (1), frontend (2), then PostSync.</text>

  <rect x="880" y="410" width="660" height="56" rx="10" fill="#fefce8" stroke="#ca8a04"/>
  <text x="898" y="434" class="t">namespace kube-system: Sealed Secrets controller (v0.41.2)</text>
  <text x="898" y="454" class="m">Holds the only private key. Turns each SealedSecret from git into a real Secret, in its own namespace only.</text>

  <g>
    <rect x="880" y="486" width="320" height="300" rx="12" fill="#ffffff" stroke="#0f766e"/>
    <text x="898" y="512" class="t">namespace dev</text>
    <text x="1182" y="512" text-anchor="end" class="m">1.2.0, auto</text>
    <rect x="898" y="526" width="284" height="34" rx="7" fill="#ccfbf1"/><text x="910" y="548" class="s">clearops-frontend (nginx)</text>
    <rect x="898" y="568" width="284" height="34" rx="7" fill="#ccfbf1"/><text x="910" y="590" class="s">clearops-api + HPA 1 to 3</text>
    <rect x="898" y="610" width="284" height="34" rx="7" fill="#ccfbf1"/><text x="910" y="632" class="s">redis-store StatefulSet + PVC</text>
    <rect x="898" y="652" width="284" height="34" rx="7" fill="#fef9c3"/><text x="910" y="674" class="s">redis-auth Secret (dev only)</text>
    <rect x="898" y="694" width="284" height="34" rx="7" fill="#f1f5f9"/><text x="910" y="716" class="s">NetworkPolicy: only API to Redis</text>
    <rect x="898" y="736" width="284" height="34" rx="7" fill="#ede9fe"/><text x="910" y="758" class="s">PostSync hook: smoke test</text>
  </g>
  <g>
    <rect x="1220" y="486" width="320" height="300" rx="12" fill="#ffffff" stroke="#0f766e"/>
    <text x="1238" y="512" class="t">namespace staging</text>
    <text x="1522" y="512" text-anchor="end" class="m">1.1.2, via PR</text>
    <rect x="1238" y="526" width="284" height="34" rx="7" fill="#ccfbf1"/><text x="1250" y="548" class="s">clearops-frontend x2</text>
    <rect x="1238" y="568" width="284" height="34" rx="7" fill="#ccfbf1"/><text x="1250" y="590" class="s">clearops-api + HPA 2 to 4</text>
    <rect x="1238" y="610" width="284" height="34" rx="7" fill="#ccfbf1"/><text x="1250" y="632" class="s">redis-store StatefulSet + PVC</text>
    <rect x="1238" y="652" width="284" height="34" rx="7" fill="#fef9c3"/><text x="1250" y="674" class="s">redis-auth Secret (staging only)</text>
    <rect x="1238" y="694" width="284" height="34" rx="7" fill="#f1f5f9"/><text x="1250" y="716" class="s">NetworkPolicy: only API to Redis</text>
    <rect x="1238" y="736" width="284" height="34" rx="7" fill="#ede9fe"/><text x="1250" y="758" class="s">PostSync hook: smoke test</text>
  </g>

  <rect x="880" y="806" width="660" height="98" rx="10" fill="#f0fdfa" stroke="#0f766e"/>
  <text x="898" y="832" class="t">Everything crosses the boundary outward</text>
  <text x="898" y="854" class="s">ArgoCD pulls git (every 3 min, or Refresh). Kubelet pulls images from Docker Hub.</text>
  <text x="898" y="874" class="s">Notifications push a commit status to GitHub. No inbound ports, no webhooks,</text>
  <text x="898" y="894" class="s">and no credentials to this cluster exist anywhere outside it.</text>

  <!-- cross arrows -->
  <path d="M810 440 C 850 440, 845 230, 896 214" fill="none" stroke="#0f766e" stroke-width="2.4" marker-end="url(#g)"/>
  <text x="816" y="478" class="lbl" fill="#0f766e">pull</text>
  <text x="816" y="494" class="m">desired</text>
  <text x="816" y="510" class="m">state</text>
  <path d="M290 760 C 600 760, 760 800, 878 760" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="420" y="790" class="lbl" fill="#1d4ed8">kubelet pulls images</text>
  <path d="M1395 184 V134 H838 V330 H814" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#v)"/>
  <text x="1120" y="112" class="lbl" fill="#6d28d9">commit status back to GitHub: argocd/clearops-dev success</text>

  <text x="40" y="968" class="m">Repos: github.com/vivianokose/clearops-app, github.com/vivianokose/clearops-gitops. Docs: nexaops-operations-lab/12.5-gitops-argocd.</text>
</svg>
