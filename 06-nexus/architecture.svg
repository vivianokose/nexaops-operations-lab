<svg width="100%" viewBox="0 0 680 470" role="img" xmlns="http://www.w3.org/2000/svg">
<title>NexaOps Nexus artifact registry architecture</title>
<desc>A laptop pushes four artifact types through a Nexus server on AWS EC2, which stores them in hosted repositories and caches public registries via proxy repositories.</desc>
<style>
.t{font-family:sans-serif;font-size:14px;fill:#2C2C2A}
.ts{font-family:sans-serif;font-size:12px;fill:#5F5E5A}
.th{font-family:sans-serif;font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="40" y="40" width="150" height="70" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="115" y="70" text-anchor="middle">Your laptop</text>
<text class="ts" x="115" y="90" text-anchor="middle">mvn, npm, twine, docker</text>

<text class="ts" x="250" y="62" text-anchor="middle">push</text>
<line x1="190" y1="75" x2="312" y2="75" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="250" y="105" text-anchor="middle">pull</text>
<line x1="312" y1="92" x2="192" y2="92" class="arr" marker-end="url(#arrow)"/>

<rect x="315" y="30" width="325" height="330" rx="16" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="477" y="55" text-anchor="middle" fill="#0C447C">Nexus on AWS EC2</text>
<text class="ts" x="477" y="73" text-anchor="middle" fill="#185FA5">runs as limited nexus user, port 8081</text>

<rect x="335" y="90" width="140" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="405" y="112" text-anchor="middle" fill="#085041">Hosted repos</text>
<text class="ts" x="405" y="129" text-anchor="middle" fill="#0F6E56">your artifacts</text>

<rect x="490" y="90" width="130" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="th" x="555" y="112" text-anchor="middle" fill="#633806">Proxy repos</text>
<text class="ts" x="555" y="129" text-anchor="middle" fill="#854F0B">cached public</text>

<rect x="335" y="160" width="285" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="477" y="187" text-anchor="middle" fill="#085041">maven-releases  ·  npm-hosted</text>

<rect x="335" y="212" width="285" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="477" y="239" text-anchor="middle" fill="#085041">pypi-hosted  ·  docker-hosted</text>

<rect x="335" y="276" width="285" height="66" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="477" y="303" text-anchor="middle">nexaops-deploy user</text>
<text class="ts" x="477" y="324" text-anchor="middle">least privilege: push yes, admin no</text>

<text class="ts" x="477" y="392" text-anchor="middle">proxy repos fetch and cache from</text>
<line x1="477" y1="360" x2="477" y2="404" class="arr" marker-end="url(#arrow)"/>

<rect x="150" y="410" width="500" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="400" y="437" text-anchor="middle" fill="#712B13">Public registries: Maven Central, npm, PyPI, Docker Hub</text>
</svg>
