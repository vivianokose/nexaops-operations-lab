apiVersion: apps/v1
kind: Deployment
metadata:
  name: clearops-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clearops-frontend
  template:
    metadata:
      labels:
        app: clearops-frontend
    spec:
      containers:
        - name: frontend
          image: clearops-frontend:1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
