# docker-compose.yml - the whole SwiftMove stack in one file.
# Run it all with: docker compose up

name: swiftmove

services:
  # ---------- The Node.js app ----------
  app:
    build: .                          # build from the Dockerfile in this folder
    image: swiftmove-app:1.0.0
    depends_on:
      mysql:
        condition: service_healthy    # wait until MySQL is HEALTHY before starting
    environment:
      DB_HOST: mysql                  # reach the db by its service name, over the network
      DB_PORT: 3306
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3000:3000"                   # map host port 3000 to container port 3000
    networks:
      - swiftmove-net

  # ---------- The MySQL database ----------
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql     # persist the database data in a named volume
    networks:
      - swiftmove-net
    # NOTE: no "ports:" here on purpose. The database is NOT exposed to your laptop.
    # Only the app (on the same network) can reach it. Security by default.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

# ---------- The private network ----------
networks:
  swiftmove-net:
    driver: bridge

# ---------- The named volume (persistent storage) ----------
volumes:
  mysql_data:
